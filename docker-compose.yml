services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Select the active Yaskawa AR model.
      ROBOT_MODEL: AR1440
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
